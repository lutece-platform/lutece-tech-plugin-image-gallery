 <#macro galleryImage codeGallery='' inputName='' idFileSelected=''>
 	<#-- idFileSelected is the id of a file, a number, or an empty string -->
 	<#local strIdFileSelected = idFileSelected?is_number?then( idFileSelected?c, idFileSelected ) />
 	<#local idContainer = 'gallery-image-' + inputName />
 	<div class="gallery-image" id="${idContainer}"></div>
 	<script>
	<#-- Vanilla JS: the front office themes do not load jQuery. The scripts of the loaded gallery are run in their order, each external
	     script (Swiper) being loaded before the next one, as innerHTML does not run them. -->
	( function( ) {
		const container = document.getElementById( '${idContainer?js_string?no_esc}' );
		const params = new URLSearchParams( { codeGallery: '${(codeGallery!)?js_string?no_esc}', inputName: '${inputName?js_string?no_esc}', idFileSelected: '${strIdFileSelected?js_string?no_esc}' } );
		const runScripts = ( root ) => Array.from( root.querySelectorAll( 'script' ) ).reduce( ( previous, oldScript ) => previous.then( ( ) => new Promise( ( resolve ) => {
			const script = document.createElement( 'script' );
			Array.from( oldScript.attributes ).forEach( ( attribute ) => script.setAttribute( attribute.name, attribute.value ) );
			if ( oldScript.hasAttribute( 'src' ) )
			{
				script.addEventListener( 'load', resolve );
				script.addEventListener( 'error', resolve );
			}
			else
			{
				script.textContent = oldScript.textContent;
			}
			oldScript.replaceWith( script );
			if ( !oldScript.hasAttribute( 'src' ) )
			{
				resolve( );
			}
		} ) ), Promise.resolve( ) );
		fetch( 'servlet/plugins/galleryimage?' + params.toString( ), { credentials: 'same-origin' } )
			.then( ( response ) => response.ok ? response.text( ) : Promise.reject( new Error( 'HTTP ' + response.status ) ) )
			.then( ( content ) => {
				container.innerHTML = content;
				return runScripts( container );
			} )
			.catch( ( error ) => console.error( 'Gallery image ${(codeGallery!)?js_string?no_esc} not loaded', error ) );
	} )( );
 	</script>
 </#macro>
